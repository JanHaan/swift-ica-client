# icalab test apps (D110): the one list of the lab's published apps and of the lab suite's tests.
# Read by icactl (window matching of the lab tests) and scripts/live-suite.sh --lab (ICA_TEST_RESOURCES, the tests).
# Published by icalab's ctx-delivery.ps1 (delivery group "Lab"); executables as the TWI process table names them.
#
# app|<resource>|<executables, comma-separated>|<word in the blank document's title>[|<first-run dialogs>]
#   first-run dialogs: title prefixes a test may close with Esc (a new lab profile shows them); any other window stops it
app|Notepad|notepad.exe|notepad
app|WordPad|wordpad.exe|wordpad
app|Paint|mspaint.exe|paint
app|File Explorer|explorer.exe|
app|Microsoft Edge|msedge.exe|edge
app|LibreOffice Writer|soffice.bin,soffice.exe,swriter.exe|libreoffice writer|Welcome to LibreOffice!,Tip of the Day
app|Lab Desktop||
#
# test|<name>|<resource>|<extra environment>|<icactl arguments>   (the suite appends "<resource>")
test|text|Notepad||cliptest
test|files|File Explorer|ICA_GDT=1 ICA_CLIP_VERSION=4|cliptest-files
test|image|Paint||cliptest-rich image
test|rich-wordpad|WordPad||cliptest-word text,rtf,image
test|rich-writer|LibreOffice Writer||cliptest-word text,rtf,image
test|cdm|File Explorer||cdmtest-explorer
test|policy|Notepad||policyprobe
